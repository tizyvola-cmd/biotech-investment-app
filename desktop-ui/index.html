<!doctype html>
<html lang="it" data-theme="violet">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperNova</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var appearance = localStorage.getItem("sn-theme");
          if (appearance !== "mint" && appearance !== "supernova") appearance = "violet";
          document.documentElement.setAttribute("data-theme", appearance);
        } catch (_) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("supernova_theme");
          if (raw) raw = raw.trim();
          var root = document.documentElement;
          root.classList.remove("dark", "theme-black", "theme-chiaro");
          if (raw === "black") {
            root.classList.add("dark", "theme-black");
          } else if (raw === "dark") {
            root.classList.add("dark");
          } else if (raw === "light") {
            root.classList.add("theme-chiaro");
          } else if (raw !== "light") {
            if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
              root.classList.add("dark");
            } else {
              root.classList.add("theme-chiaro");
            }
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-surface text-ink antialiased">
    <div id="root"></div>
    <script>
      (function () {
        try {
          var z =
            sessionStorage.getItem("supernova.pageZoom") ||
            localStorage.getItem("supernova.pageZoom");
          var n = z ? Number(z) : 1;
          document.documentElement.style.zoom = "";
          document.body.style.zoom = "";
          if (n === n && n >= 0.8 && n <= 1.6) {
            if (window.supernova && typeof window.supernova.setPageZoomFactor === "function") {
              window.supernova.setPageZoomFactor(n);
            } else if (n !== 1) {
              var root = document.getElementById("root");
              if (root) root.style.zoom = String(Math.round(n * 100) / 100);
            }
          }
        } catch (_) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
